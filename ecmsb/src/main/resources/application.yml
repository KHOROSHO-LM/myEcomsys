server:
  port: 8080

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: ecms
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3305/shop_admin?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:Lmi503606707}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    # 后端返回前端的日期格式
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: org.example.ecms.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    org.example.ecms: debug

# 业务自定义配置
ecms:
  jwt:
    # HS256 密钥（base64 字符串），生产请通过环境变量 JWT_SECRET 注入
    secret: ${JWT_SECRET:dGhpcy1pcy1hLWRlbW8tc2VjcmV0LWtleS1mb3ItZWNtcy1wcm9qZWN0LWRvLW5vdC11c2UtaW4tcHJvZHViYXRpb24}
    # token 有效期（分钟），默认 2 小时
    expire-minutes: ${JWT_EXPIRE:120}
